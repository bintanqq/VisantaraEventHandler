# ================================================================
#  Forge Station Menu - VisantaraEventHandler
# ================================================================
#
#  Trigger : klik kanan/kiri block di koordinat yang terdaftar
#  GUI     : satu template, per rank hanya beda max-queue,
#            title-suffix, dan fill-item.
#
#  Placeholder di lore/station-id:
#    {max_queue} -> nilai max-queue rank tersebut
#    {rank}      -> nama rank (untuk station-id otomatis)
#
# ================================================================

forge-menu:

  # -- Blok yang jadi trigger --------------------------------------
  # Format: world;x;y;z  (bisa multiple)
  trigger-blocks:
    - "spawntes;-4;63;-45"
    - "spawntes;-5;63;-45"

  # -- Pesan error saat rank tidak dikenali ------------------------
  no-rank-message: "&cKamu tidak memiliki akses ke Forge Station."

  # -- Pengaturan Switch Station -----------------------------------
  # Slot yang digunakan untuk berpindah station di dalam GUI MMOItems
  switch-slot: 40

  # Kata kunci pada nama item (Display Name) di dalam slot 40
  # Jika nama item mengandung kata kunci berikut, target station akan dibuka
  switch-triggers:
    material: "MATERIAL" # Contoh: jika item bernama "Switch to Material", akan membuka material station
    nature: "NATURE"     # Contoh: jika item bernama "Switch to Nature", akan membuka nature station

  # ================================================================
  #  PER RANK — hanya set yang beda-beda aja
  # ================================================================
  #  Konfigurasi tiap rank:
  #   material: ID station MMOItems untuk material
  #   nature  : ID station MMOItems untuk nature
  # ================================================================
  ranks:
    default:
      material: "material-default"
      nature: "nature-default"

    vip:
      material: "material-vip"
      nature: "nature-vip"

    mvp:
      material: "material-mvp"
      nature: "nature-mvp"

    elite:
      material: "material-elite"
      nature: "nature-elite"

    legend:
      material: "material-legend"
      nature: "nature-legend"

    premium:
      material: "material-premium"
      nature: "nature-premium"